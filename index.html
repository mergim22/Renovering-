<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Renoveringsstatus</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--line:#e3e6ea;--ac:#1f6feb;--ok:#1a9f55;--okbg:#e6f6ec;--bad:#d1342f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1e2328;--tx:#eceff3;--mut:#9aa3af;--line:#2d343c;--ac:#5b9bff;--ok:#3ccf7a;--okbg:#1b3326;--bad:#ff6b66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
  .logo{display:block;width:100%;max-width:260px;aspect-ratio:2.2/1;object-fit:cover;object-position:50% 51%;margin:0 auto 12px;border-radius:12px;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.apt{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
.btn.sm{padding:9px 12px;font-size:14px;margin-top:8px;margin-right:6px}
.btn.g{background:transparent;color:var(--ac);padding:8px 0}
.btn.d{background:transparent;color:var(--bad);padding:8px 0;font-weight:500}
.me{font-size:13px;color:var(--mut);background:none;border:0;padding:6px 0}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-bottom:8px}
textarea{min-height:80px;resize:vertical}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.task.done{background:var(--okbg);border-color:transparent}
.trow{display:flex;gap:12px;align-items:center}
.chk{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--mut);background:transparent;color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.tb{flex:1;min-height:44px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.t{font-weight:600}.s{font-size:12px;color:var(--mut)}
.pn{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph img{width:78px;height:78px;object-fit:cover;border-radius:8px;cursor:pointer}
.er{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.er input{margin:0}.er button{flex:none;width:38px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.note{font-size:13px;color:var(--mut);margin:0 0 8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#fff;padding:12px;border-radius:10px;text-align:center;display:none;z-index:9}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:10}
.lb img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Laddar…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://ojrnpumhzzrbvfbwrnxc.supabase.co";
const SUPABASE_KEY="sb_publishable_yCxPAypu9sC3iEkGz2riXw_zSm36GFo";
const ADMIN_EMAIL="mergim@bygg-maleri.se";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,apts=[],tasks=[],prog={},view=null,loaded=false,adding=false,askName=false,pending=null,delArm=false,unArm=null,open=null,editing=false,draft=[],lb=null,noteDraft={},me="";
try{me=localStorage.getItem("namn")||""}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isAdmin=()=>user&&user.email&&user.email.toLowerCase()===ADMIN_EMAIL;
function toast(m,ok){const t=$("toast");t.textContent=m;t.style.background=ok?"var(--ac)":"var(--bad)";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
function fmt(ts){const d=new Date(ts);return d.toLocaleDateString("sv-SE",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}
const doneCount=id=>tasks.filter(t=>prog[id+"__"+t.id]).length;
function soft(){const e=document.activeElement;if(e&&/TEXTAREA|INPUT/.test(e.tagName))return;render()}

async function loadAll(){
  const [a,t,p]=await Promise.all([sb.from("apartments").select("*").order("created_at",{ascending:false}),sb.from("tasks").select("*").order("position"),sb.from("progress").select("*")]);
  if(a.error||t.error||p.error){toast("Kunde inte hämta data");return}
  apts=a.data;tasks=t.data;prog={};p.data.forEach(r=>prog[r.apt_id+"__"+r.task_id]=r);loaded=true;soft();
}
let rt;function startRealtime(){
  sb.channel("all").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rt);rt=setTimeout(loadAll,300)}).subscribe();
}

function render(){
  const nt=$("nt");if(nt)noteDraft[nt.dataset.k]=nt.value;
  const a=$("app");
  if(lb){a.innerHTML=`<div class="lb" id="lb"><img src="${esc(lb)}"></div>`;$("lb").onclick=()=>{lb=null;render()};return}
  if(!user){
    a.innerHTML=`<img class="logo" src="IMG_8028.jpeg" alt="Kristianstad Bygg & Måleri"><h1>Renoveringsstatus</h1><div class="card"><input id="em" type="email" placeholder="E-post" autocomplete="username"><input id="pw" type="password" placeholder="Lösenord" autocomplete="current-password"><button class="btn" id="li" style="width:100%">Logga in</button></div>`;
    const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)toast("Fel e-post eller lösenord")};
    $("li").onclick=go;$("pw").onkeydown=e=>{if(e.key==="Enter")go()};return;
  }
  if(askName){
    a.innerHTML=`<h1>Vad heter du?</h1><div class="card"><p class="note">Ditt namn visas när du markerar moment som klara.</p><input id="nmme" placeholder="Ditt namn" value="${esc(me)}"><button class="btn" id="svme" style="width:100%">Spara</button></div>`;
    const go=()=>{const v=$("nmme").value.trim();if(!v)return;me=v;try{localStorage.setItem("namn",me)}catch(e){}askName=false;const p=pending;pending=null;render();if(p)toggle(p[0],p[1])};
    $("svme").onclick=go;$("nmme").onkeydown=e=>{if(e.key==="Enter")go()};return;
  }
  if(editing)return renderEdit(a);
  if(view){
    const ap=apts.find(x=>x.id===view);
    if(!ap){view=null;return render()}
    const n=doneCount(ap.id),p=tasks.length?Math.round(n/tasks.length*100):0;
    a.innerHTML=`<button class="btn g" id="back">← Alla lägenheter</button><h1>${esc(ap.name)}</h1>
    <div class="card"><div class="row"><b>${n} av ${tasks.length} klara</b><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>
    ${tasks.map(t=>{const k=ap.id+"__"+t.id,r=prog[k],o=open===k,ph=(r&&r.photos)||[];
      return `<div class="task ${r?"done":""}"><div class="trow"><button class="chk" data-t="${t.id}" aria-label="Klart">${r?"✓":""}</button><div class="tb" data-o="${k}"><div class="t">${esc(t.name)}</div>${r?`<div class="s">Klart av ${esc(r.done_by)} · ${fmt(r.done_at)}${r.note?" · 💬":""}${ph.length?" · 📷"+ph.length:""}</div>`:""}</div></div>
      ${r&&o?`<div class="pn"><textarea id="nt" data-k="${k}" placeholder="Skriv en kommentar…">${esc(noteDraft[k]!=null?noteDraft[k]:(r.note||""))}</textarea><button class="btn sm" data-sv="${k}">Spara kommentar</button><label class="btn sm">📷 Lägg till bild<input type="file" accept="image/*" hidden data-ph="${k}"></label><div class="ph">${ph.map(u=>`<img src="${esc(u)}" data-lb="${esc(u)}">`).join("")}</div></div>`:""}</div>`}).join("")}
    ${isAdmin()?'<button class="btn d" id="del">'+(delArm?"Tryck igen för att ta bort för gott":"Ta bort lägenhet")+'</button>':""}`;
    $("back").onclick=()=>{view=null;delArm=false;open=null;render()};
    a.querySelectorAll(".chk").forEach(b=>b.onclick=()=>toggle(ap.id,b.dataset.t));
    a.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{const k=b.dataset.o;if(!prog[k])return;open=open===k?null:k;render()});
    a.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>saveNote(b.dataset.sv));
    a.querySelectorAll("[data-ph]").forEach(b=>b.onchange=()=>addPhoto(b.dataset.ph,b.files[0]));
    a.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{lb=b.dataset.lb;render()});
    const d=$("del");if(d)d.onclick=()=>removeApt(ap);
    return;
  }
  const sorted=[...apts].sort((x,y)=>doneCount(x.id)-doneCount(y.id));
  a.innerHTML=`<img class="logo" src="IMG_8028.jpeg" alt=""><div class="row"><h1>Lägenheter</h1><button class="me" id="me">${me?"👤 "+esc(me):"Ange ditt namn"}</button></div>
  ${adding?`<div class="card"><input id="nm" placeholder="Adress / lägenhet, t.ex. Storgatan 4, lgh 1102"><div class="row"><button class="btn g" id="cx">Avbryt</button><button class="btn" id="sv">Lägg till</button></div></div>`:`<button class="btn" id="add" style="width:100%;margin-bottom:12px">+ Ny lägenhet</button>`}
  ${!loaded?'<div class="empty">Laddar…</div>':sorted.length?sorted.map(x=>{const n=doneCount(x.id),p=tasks.length?Math.round(n/tasks.length*100):0,nx=tasks.find(t=>!prog[x.id+"__"+t.id]);
    return `<button class="card apt" data-id="${x.id}"><div class="row"><b style="font-size:17px">${esc(x.name)}</b><span style="color:${p==100?"var(--ok)":"var(--mut)"};font-weight:700">${p}%</span></div><div class="sub">${nx?"Nästa: "+esc(nx.name):"✓ Allt klart"}</div><div class="bar"><i style="width:${p}%"></i></div></button>`}).join(""):'<div class="empty">Inga lägenheter ännu. Tryck på “Ny lägenhet”.</div>'}
  ${isAdmin()?'<button class="btn g" id="edt" style="margin-top:8px">⚙ Redigera moment (admin)</button><br>':""}<button class="btn g" id="out" style="color:var(--mut)">Logga ut</button>`;
  $("me").onclick=()=>{askName=true;render()};
  $("out").onclick=()=>sb.auth.signOut();
  a.querySelectorAll(".apt").forEach(b=>b.onclick=()=>{view=b.dataset.id;render();scrollTo(0,0)});
  if(adding){$("cx").onclick=()=>{adding=false;render()};$("sv").onclick=addApt;$("nm").focus()}else $("add").onclick=()=>{adding=true;render()};
  const e=$("edt");if(e)e.onclick=()=>{draft=tasks.map(t=>({id:t.id,name:t.name}));editing=true;render()};
}
function renderEdit(a){
  a.innerHTML=`<h1>Redigera moment</h1><p class="note">Ändringen gäller alla lägenheter. Flytta med pilarna. Tar du bort ett moment försvinner det, med kommentarer och bilder, från alla lägenheter.</p>
  ${draft.map((t,i)=>`<div class="er"><input data-n="${i}" value="${esc(t.name)}"><button data-up="${i}">▲</button><button data-dn="${i}">▼</button><button data-rm="${i}">✕</button></div>`).join("")}
  <div class="er" style="margin-top:10px"><input id="newt" placeholder="Nytt moment…"><button id="addt" style="width:60px">+</button></div>
  <div class="row" style="margin-top:12px"><button class="btn g" id="cxt">Avbryt</button><button class="btn" id="svt">Spara ändringar</button></div>`;
  a.querySelectorAll("[data-n]").forEach(i=>i.oninput=()=>draft[+i.dataset.n].name=i.value);
  const mv=(i,d)=>{const j=i+d;if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]];render()};
  a.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));
  a.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  a.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);render()});
  const add=()=>{const v=$("newt").value.trim();if(!v)return;draft.push({id:null,name:v});render()};
  $("addt").onclick=add;$("newt").onkeydown=e=>{if(e.key==="Enter")add()};
  $("cxt").onclick=()=>{editing=false;render()};
  $("svt").onclick=async()=>{
    const list=draft.map(t=>({id:t.id,name:t.name.trim()})).filter(t=>t.name);
    try{
      const keep=new Set(list.filter(t=>t.id).map(t=>t.id));
      for(const t of tasks)if(!keep.has(t.id)){const r=await sb.from("tasks").delete().eq("id",t.id);if(r.error)throw r.error}
      for(let i=0;i<list.length;i++){const t=list[i];
        const r=t.id?await sb.from("tasks").update({name:t.name,position:i+1}).eq("id",t.id):await sb.from("tasks").insert({name:t.name,position:i+1});
        if(r.error)throw r.error}
      editing=false;toast("Moment sparade",true);await loadAll();
    }catch(e){toast("Kunde inte spara. Bara admin kan ändra moment.")}
  };
}
async function addApt(){
  const v=$("nm").value.trim();if(!v)return;
  const r=await sb.from("apartments").insert({name:v});
  if(r.error)toast("Kunde inte spara");else{adding=false;await loadAll()}
}
async function toggle(aid,tid){
  if(!me){pending=[aid,tid];askName=true;render();return}
  const k=aid+"__"+tid,r=prog[k];
  if(r){
    if((r.note||(r.photos&&r.photos.length))&&unArm!==k){unArm=k;toast("Tryck igen för att ångra. Kommentar och bilder tas bort.");return}
    unArm=null;if(open===k)open=null;
    const x=await sb.from("progress").delete().eq("apt_id",aid).eq("task_id",tid);
    if(x.error)toast("Kunde inte spara");
  }else{
    const x=await sb.from("progress").insert({apt_id:aid,task_id:tid,done_by:me});
    if(x.error)toast("Kunde inte spara");else open=k;
  }
  await loadAll();
}
async function saveNote(k){
  const r=prog[k],v=(($("nt")||{}).value||"").trim();
  const x=await sb.from("progress").update({note:v}).eq("apt_id",r.apt_id).eq("task_id",r.task_id);
  if(x.error)toast("Kunde inte spara kommentaren");else{delete noteDraft[k];toast("Kommentar sparad",true);await loadAll()}
}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),"image/jpeg",.8)};im.onerror=()=>res(f);im.src=u})}
async function addPhoto(k,f){
  if(!f)return;const r=prog[k];
  try{
    toast("Laddar upp bild…",true);
    const blob=await shrink(f),path=`${r.apt_id}/${r.task_id}/${Date.now()}.jpg`;
    const up=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
    if(up.error)throw up.error;
    const url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    const x=await sb.from("progress").update({photos:[...(r.photos||[]),url]}).eq("apt_id",r.apt_id).eq("task_id",r.task_id);
    if(x.error)throw x.error;
    toast("Bild sparad",true);await loadAll();
  }catch(e){toast("Kunde inte ladda upp bilden")}
}
async function removeApt(ap){
  if(!delArm){delArm=true;render();return}delArm=false;
  const x=await sb.from("apartments").delete().eq("id",ap.id).select();
  if(x.error||!x.data.length)toast("Kunde inte ta bort. Bara admin kan det.");else{view=null;await loadAll()}
}
sb.auth.onAuthStateChange((ev,s)=>{
  const u=s&&s.user||null,was=user;user=u;
  if(u&&!me){me=(u.email||"").split("@")[0]}
  if(u&&!was){loaded=false;render();loadAll();startRealtime()}
  else if(!u){sb.removeAllChannels();apts=[];tasks=[];prog={};view=null;render()}
});
sb.auth.getSession().then(({data})=>{if(!data.session)render()});
</script>
</body>
</html>
